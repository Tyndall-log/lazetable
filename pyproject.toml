[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lazetable"
version = "0.4.0"
description = "SQLite-backed lazy dataset artifacts with resumable parallel builders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tyndall-log" },
]
keywords = [
  "lazy-loading",
  "dataset",
  "table",
  "parquet",
  "parser",
  "sqlite",
  "machine-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26.0",
  "pyarrow>=17.0.0",
  "tqdm>=4.66.0",
]

[project.urls]
Documentation = "https://github.com/Tyndall-log/lazetable#readme"
Source = "https://github.com/Tyndall-log/lazetable"
Issues = "https://github.com/Tyndall-log/lazetable/issues"

[project.optional-dependencies]
torch = [
  "torch>=2.1.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lazetable"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/USAGE_GUIDE.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.tmp_pytest"]
